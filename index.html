<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackjack</title>
<meta name="description" content="Minimal blackjack. Six decks, dealer stands on soft 17, blackjack pays 3:2, split and insurance included.">
<meta name="theme-color" content="#F5F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1011" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F5F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blackjack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<script>
  // theme before the first paint, so the page never flashes light
  alert('Алина, выходи отсюда');
  (function(){try{var t=localStorage.getItem('bj.theme');t=t?JSON.parse(t):'auto';
    var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme',d?'dark':'light');
    document.documentElement.setAttribute('data-theme-mode',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <h1>Blackjack</h1>

  <div class="tools">
    <div class="seg" role="radiogroup" aria-label="Theme" id="themeSeg" title="Theme (T)">
      <div class="knob" id="themeKnob"></div>
      <button type="button" role="radio" data-mode="light" aria-checked="false" aria-label="Light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" role="radio" data-mode="auto" aria-checked="false" aria-label="Follow the system theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" role="radio" data-mode="dark" aria-checked="false" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>

    <button type="button" class="icon" id="btnSound" aria-pressed="true" aria-label="Sound on" title="Sound (A)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6.5 9H3v6h3.5L11 19z"/>
        <path class="wave" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18.2 7a7 7 0 0 1 0 10"/>
        <path class="cross" d="M16 10l5 5M21 10l-5 5"/>
      </svg>
    </button>
    <button type="button" class="icon" id="btnHint" aria-pressed="false" aria-label="Show the recommended move" title="Basic-strategy hint (G)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 17h5.6M10 20.2h4"/><path d="M12 3.4a5.6 5.6 0 0 1 3.4 10.1c-.6.5-.9 1-1 1.7H9.6c-.1-.7-.4-1.2-1-1.7A5.6 5.6 0 0 1 12 3.4z"/></svg>
    </button>
    <button type="button" class="icon" id="btnStats" aria-label="Session statistics" title="This session (I)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
    </button>
    <button type="button" class="icon" id="btnHelp" aria-label="How to play" title="How to play (?)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.5"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <div class="bank">
    <span class="lbl">Bankroll</span>
    <span class="val num" id="bankroll">1,000</span>
  </div>
</header>

<main class="table" id="table">
  <!-- what a real table has printed on the cloth, in the place a real table has
       it: above the betting circle, curved, and quiet enough to stay furniture -->
  <svg class="print" viewBox="0 0 400 165" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <path id="pLine" d="M16 84 Q200 6 384 84"/>
      <path id="pBig" d="M28 116 Q200 40 372 116"/>
      <path id="pSmall" d="M72 156 Q200 86 328 156"/>
    </defs>
    <use href="#pLine" class="line"/>
    <text class="big"><textPath href="#pBig" startOffset="50%" text-anchor="middle">BLACKJACK PAYS 3 TO 2</textPath></text>
    <text class="small"><textPath href="#pSmall" startOffset="50%" text-anchor="middle">INSURANCE PAYS 2 TO 1</textPath></text>
  </svg>

  <div class="shoe" id="shoe" aria-hidden="true"><span class="left num" id="shoeLeft"></span></div>

  <section class="dealer" aria-label="Dealer's hand">
    <div class="meta"><span class="who">Dealer</span><span class="score num" id="dealerScore" aria-live="polite"></span></div>
    <div class="cards empty" id="dealerCards"></div>
  </section>

  <div class="mid">
    <div class="result" id="result" role="status"></div>
    <div class="ins" id="insBox" hidden>
      <span class="stack" id="insChips" aria-hidden="true"></span>
      <span class="lbl">Insurance</span><span class="val num" id="insVal">0</span>
      <span class="ins-badge" id="insBadge" hidden></span>
    </div>
    <div class="betspot empty" id="betSpot">
      <span class="stack" id="betStack" aria-hidden="true"></span>
      <span class="lbl">Bet</span><span class="val num" id="betVal">0</span>
    </div>
  </div>

  <section class="hands" id="hands" aria-label="Your hands"></section>
</main>

<footer class="controls" id="controls">
  <div class="row chips" id="uiBet">
    <button type="button" class="chip c5" data-chip="5"><span>5</span><kbd>1</kbd></button>
    <button type="button" class="chip c25" data-chip="25"><span>25</span><kbd>2</kbd></button>
    <button type="button" class="chip c100" data-chip="100"><span>100</span><kbd>3</kbd></button>
    <button type="button" class="chip c500" data-chip="500"><span>500</span><kbd>4</kbd></button>
  </div>
  <div class="row" id="uiDeal">
    <button type="button" class="btn quiet" id="btnClear">Clear <kbd>C</kbd></button>
    <button type="button" class="btn quiet" id="btnX2">×2 <kbd>X</kbd></button>
    <button type="button" class="btn quiet" id="btnMax">Max <kbd>M</kbd></button>
    <button type="button" class="btn primary" id="btnDeal">Deal <kbd>Space</kbd></button>
  </div>

  <div class="row" id="uiPlay" hidden>
    <button type="button" class="btn" id="btnHit">Hit <kbd>1</kbd></button>
    <button type="button" class="btn" id="btnStand">Stand <kbd>2</kbd></button>
    <button type="button" class="btn" id="btnDouble">Double <kbd>3</kbd></button>
    <button type="button" class="btn" id="btnSplit">Split <kbd>4</kbd></button>
  </div>

  <div class="row" id="uiIns" hidden>
    <button type="button" class="btn" id="btnInsYes">Insure <span class="amt num">0</span> <kbd>1</kbd></button>
    <button type="button" class="btn" id="btnInsNo">No insurance <kbd>2</kbd></button>
  </div>

  <div class="row" id="uiNext" hidden>
    <button type="button" class="btn primary" id="btnNext">Next hand <kbd>Space</kbd></button>
  </div>
  <div class="row" id="uiBroke" hidden>
    <button type="button" class="btn primary" id="btnReset">Reset bankroll <kbd>R</kbd></button>
  </div>

  <p class="hint" id="hint">Six decks · dealer stands on soft 17 · double after a split</p>
</footer>

<div class="toast" id="toast" role="status"></div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle">How to play</h2>
    <button type="button" class="icon" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody" tabindex="0"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
